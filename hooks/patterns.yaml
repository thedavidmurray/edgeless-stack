# Damage Control Patterns
# PreToolUse hook configuration for blocking dangerous operations
#
# Three sections:
#   dangerous_commands  - regex patterns matched against Bash commands
#   paths               - file path protections (zero_access, read_only, no_delete)
#   allowlist            - substring patterns that override blocks
#
# CUSTOMIZE: Add project-specific patterns to each section.

dangerous_commands:
  bash:
    # Patterns that will BLOCK execution (case insensitive regex)
    block_patterns:
      # Destructive file operations
      - 'rm\s+-rf\s+/'
      - 'rm\s+-rf\s+~'
      - 'rm\s+-rf\s+\*'
      - 'rm\s+-rf\s+\.\.'
      - 'rm\s+-f\s+/'
      - 'rmdir\s+/'
      - '>\s*/dev/sda'
      - 'mkfs\.'
      - 'dd\s+if=.+of=/dev'

      # Git destructive operations
      - 'git\s+reset\s+--hard'
      - 'git\s+push\s+.*--force'
      - 'git\s+push\s+-f'
      - 'git\s+clean\s+-fd'
      - 'git\s+checkout\s+--\s+\.'

      # Database destructive
      - 'DROP\s+DATABASE'
      - 'DROP\s+TABLE'
      - 'TRUNCATE\s+TABLE'
      - 'DELETE\s+FROM\s+\w+\s*;'

      # Cloud destructive (AWS, GCP, Firebase)
      - 'aws\s+.*\s+delete'
      - 'aws\s+s3\s+rm\s+.*--recursive'
      - 'gcloud\s+.*\s+delete'
      - 'firebase\s+.*\s+delete'
      - 'kubectl\s+delete\s+namespace'

      # System destructive
      - 'chmod\s+-R\s+777\s+/'
      - 'chown\s+-R\s+.*\s+/'
      - 'kill\s+-9\s+-1'
      - 'pkill\s+-9'

      # Dangerous curl/wget patterns
      - 'curl.*\|\s*sh'
      - 'curl.*\|\s*bash'
      - 'wget.*\|\s*sh'

      # CUSTOMIZE: Add your own block patterns below
      # - 'your-pattern-here'

paths:
  # ZERO ACCESS: Never read or write
  zero_access:
    - '/etc/passwd'
    - '/etc/shadow'
    - '/etc/sudoers'
    - '.ssh/id_'
    - '.ssh/authorized_keys'
    - '.aws/credentials'
    - '.gnupg/'
    - '.env.production'
    - 'credentials.json'
    - 'secrets.yaml'
    - 'service-account.json'
    # CUSTOMIZE: Add paths that should never be accessed
    # - 'my-secrets/'

  # READ ONLY: Can read but never modify
  read_only:
    - 'node_modules/'
    - '.git/objects/'
    - 'vendor/'
    - '__pycache__/'
    - '.venv/lib/'
    - 'dist/'
    - 'build/'
    # CUSTOMIZE: Add project-specific read-only paths
    # - 'my-generated-dir/'

  # NO DELETE: Can modify but never delete
  no_delete:
    - 'src/'
    - 'lib/'
    - 'app/'
    - 'package.json'
    - 'package-lock.json'
    - 'requirements.txt'
    - 'Cargo.toml'
    - 'go.mod'
    - 'pyproject.toml'
    - '.claude/'
    - 'CLAUDE.md'
    # CUSTOMIZE: Add paths that should never be deleted
    # - 'my-config.yaml'

# Allowlist: Patterns that override blocks (be careful!)
allowlist:
  - '/tmp/'
  - '/var/tmp/'
  - '.test.'
  - '_test.'
  - 'test_'
  # CUSTOMIZE: Add paths that should bypass protection
  # - 'my-playground/'
